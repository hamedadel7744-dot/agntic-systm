name: Health Watch

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Check production health
        run: |
          BODY=$(curl -sf https://agntic-systm.vercel.app/api/system/health) || { echo "::error::Health endpoint unreachable"; exit 1; }
          echo "$BODY" | node -e "
            let d = '';
            process.stdin.on('data', c => d += c);
            process.stdin.on('end', () => {
              let r;
              try { r = JSON.parse(d); } catch { console.log('::error::Health endpoint returned non-JSON'); process.exit(1); }
              if (r.status === 'fail') {
                // env-group failing rows are hidden from this public endpoint; their
                // impact still lands in the aggregate status, so fail on it directly.
                const ids = (r.checks ?? []).filter(c => c.status === 'fail').map(c => c.id);
                const label = ids.length > 0 ? ids.join(', ') : 'aggregate fail (failing rows are env-group, hidden from this endpoint)';
                console.log('::error::Production failing: ' + label + ' — open /api/system/health for causes and fixes');
                if (ids.includes('llm.config')) console.log('::error::llm.config failing — EVERY agent run now fails at invokeLLM (BUILT_IN_FORGE_API_KEY missing or rejected)');
                process.exit(1);
              }
              if (r.status !== 'ok') {
                console.log('::warning::Degraded at config level (env/llm) — overall ' + r.status + '. Not paging.');
              }
            });
          "
      - name: Notify Slack on failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "::warning::SLACK_WEBHOOK_URL secret not set — Slack notification skipped (add it under Settings > Secrets and variables > Actions to enable paging)"
            exit 0;
          fi
          RUN_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl -sf -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"Health Watch: production health check FAILED. run: ${RUN_URL} - health: https://agntic-systm.vercel.app/api/system/health\"}" \
            "$SLACK_WEBHOOK_URL" || echo "::warning::Slack webhook call failed — page the on-call manually"
